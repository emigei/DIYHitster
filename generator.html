<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>HITSTER DIY - 6.5cm 3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #222; color: white; margin: 0; padding: 0; }
        .no-print { background: #333; padding: px; text-align: center; border-bottom: 1px solid #444; }
        #output { display: flex; flex-direction: column; align-items: center; padding-top: px; }

        .print-sheet {
            width: 21cm;
            height: 29.7cm;
            background: white;
            position: relative;
            page-break-after: always;
            overflow: hidden;
            margin-bottom: 40px;
        }

        /* Hauptspalte links: 4 Paare untereinander */
        .main-grid {
            position: absolute;
            top: 0.5cm; 
            left: 0.2cm;
            width: 13cm; 
            display: block;
        }

        /* Seitenstreifen rechts: Wir rücken ihn auf 13.2cm ein */
        .side-grid {
            position: absolute;
            top: 0.5cm; 
            left: 13.2cm; 
            width: 6.5cm;
            height: 28cm;
        }

        .card-pair { 
            display: flex; 
            width: 13cm; 
            height: 6.5cm; 
            outline: 0.1mm solid rgba(0,0,0,0.1);
        }

        /* Die gedrehten Paare im Side-Grid */
        .card-pair.rotated {
            position: absolute;
            transform: rotate(90deg);
            transform-origin: top left;
            /* Nach Drehung ist die 'Breite' 13cm die neue 'Höhe' */
            left: 6.5cm; 
            width: 13cm;
            height: 6.5cm;
        }

        .card {
            width: 6.5cm; height: 6.5cm; 
            position: relative;
            background-size: cover; background-position: center;
            -webkit-print-color-adjust: exact;
        }

        .front { background-image: url('QR-CODE-SEITE.png'); }
        .back { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            padding: 10px; box-sizing: border-box; text-align: center; background-size: cover;
            position: relative;
        }

        .qr-wrapper {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 6px; border-radius: 8px; display: flex;
        }

        /* Textelemente */
        .info-title { font-size: px; font-weight: bold; width: 90%; margin-bottom: 3px; text-transform: uppercase; color: white; text-shadow: 0 1px 3px #000; line-height: 1.1; z-index: 2; }
        .info-artist { font-size: 18px; color: #ff5500; font-weight: bold; margin-bottom: 8px; text-shadow: 0 1px 3px #000; z-index: 2; }
        .info-year { font-size: 60px; font-weight: 900; color: #fff; margin: 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); z-index: 2; }

        @media print {
            .no-print { display: none; }
            body { background: white; }
            .print-sheet { margin: 0; border: none; }
            @page { size: 21cm 29.7cm; margin: 0; }
        }
    </style>
</head>
<body>

<div class="no-print">
    <h1>6,5cm - Side-Grid Fixed</h1>
    ID von: <input type="number" id="id-from" value="1"> 
    bis: <input type="number" id="id-to" value="6">
    <button onclick="generateFilteredCards()" style="background:#ff5500; color:white; border:none; padding:10px; border-radius:8px; cursor:pointer;">Generieren</button>
    <button onclick="window.print()" style="background:#444; color:white; border:none; padding:10px; border-radius:8px; cursor:pointer;">Drucken</button>
</div>

<div id="output"></div>

<script>
    const YOUR_DOMAIN = window.location.origin + "/DIYHitster/index.html"; 
    let allPlaylists = {};

    async function init() {
        try {
            const res = await fetch('songs.json');
            allPlaylists = await res.json();
        } catch (e) { console.error("Ladefehler", e); }
    }

    function generateFilteredCards() {
        const from = parseInt(document.getElementById('id-from').value);
        const to = parseInt(document.getElementById('id-to').value);
        const output = document.getElementById('output');
        output.innerHTML = ""; 

        let songs = [];
        for (const playlistName in allPlaylists) {
            const playlist = allPlaylists[playlistName];
            const yearColor = playlist.color || "#ff5500";
            for (const id in playlist) {
                if (id === "color") continue;
                if (parseInt(id) >= from && parseInt(id) <= to) {
                    songs.push({id, song: playlist[id], yearColor});
                }
            }
        }

        for (let i = 0; i < songs.length; i += 6) {
            const sheet = document.createElement('div');
            sheet.className = 'print-sheet';
            
            const mainGrid = document.createElement('div');
            mainGrid.className = 'main-grid';
            
            const sideGrid = document.createElement('div');
            sideGrid.className = 'side-grid';

            sheet.appendChild(mainGrid);
            sheet.appendChild(sideGrid);
            output.appendChild(sheet);

            for (let j = 0; j < 6 && (i + j) < songs.length; j++) {
                const item = songs[i + j];
                const pair = document.createElement('div');
                
                if (j < 4) {
                    pair.className = 'card-pair';
                    mainGrid.appendChild(pair);
                } else {
                    pair.className = 'card-pair rotated';
                    // j=4 -> 0cm, j=5 -> 13.5cm
                    pair.style.top = (j === 4 ? "0cm" : "13.5cm"); 
                    sideGrid.appendChild(pair);
                }

                pair.innerHTML = `
                    <div class="card front"><div class="qr-wrapper" id="qr-${item.id}"></div></div>
                    <div class="card back" style="background-image: url('TITEL+JAHRESZAHL_SEITE.png');">
                        <div class="info-title">${item.song.title}</div>
                        <div class="info-artist">${item.song.artist}</div>
                        <div class="info-year" style="color: ${item.yearColor};">${item.song.year}</div>
                    </div>
                `;
                
                new QRCode(document.getElementById(`qr-${item.id}`), {
                    text: `${YOUR_DOMAIN}?id=${item.id}`,
                    width: 125, height: 125
                });
            }
        }
    }
    init();
</script>
</body>
</html>
