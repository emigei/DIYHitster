<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>HITSTER DIY - ID Filter Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #222; color: white; padding: 20px; }

        /* Steuerung oben */
        .no-print { 
            background: #333; padding: 25px; border-radius: 15px; 
            margin-bottom: 30px; text-align: center; border: 1px solid #444; 
        }

        .filter-group { display: inline-block; margin: 10px 20px; }
        input { 
            padding: 8px; border-radius: 5px; border: 1px solid #ff5500; 
            background: #444; color: white; width: 60px; text-align: center;
        }

        .btn-generate { 
            background: #ff5500; color: white; border: none; padding: 10px 20px; 
            border-radius: 8px; font-weight: bold; cursor: pointer; margin-left: 10px;
        }

        /* Karten-Layout */
        .card-pair { 
            display: flex; flex-direction: row; flex-wrap: nowrap; gap: 0; 
            margin-bottom: 40px; justify-content: center; page-break-inside: avoid;
        }

        .card {
            width: 480px; height: 480px; position: relative;
            background-size: cover; background-position: center;
            -webkit-print-color-adjust: exact; print-color-adjust: exact;
        }

        .front { background-image: url('QR-CODE-SEITE.png'); }

        .back { 
            background-image: url('TITEL+JAHRESZAHL_SEITE.png'); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            padding: 55px; box-sizing: border-box; text-align: center;
            position: relative; overflow: hidden;
        }
        .back { 
            /* Kein festes Background-Image hier, das machen wir per JS */
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            padding: 55px; box-sizing: border-box; text-align: center;
            position: relative; overflow: hidden;
            background-size: cover;
            background-position: center;
        }

        .qr-wrapper {
            position: absolute; top: 49.5%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 6px; border-radius: 8px; display: flex;
        }

        /* Text über dem Farb-Layer */
        .info-title, .info-artist, .info-year, .info-label { position: relative; z-index: 2; }

        .info-title { font-size: 20px; font-weight: bold; width: 80%; max-width: 80%; margin-bottom: 5px; text-transform: uppercase; text-shadow: 0 2px 4px #000; overflow-wrap: break-word; line-height: 1.1; }
        .info-artist { font-size: 16px; color: #ff5500; width: 80%; max-width: 80%; font-weight: bold; margin-bottom: 15px; text-shadow: 0 2px 4px #000; overflow-wrap: break-word; }
        .info-year { font-size: 60px; font-weight: 900; color: #fff; margin: 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); line-height: 1; }
        .info-label { font-size: 10px; text-transform: uppercase; color: #bbb; margin-top: 5px; letter-spacing: 1px; }

        @media print {
            .no-print { display: none; }
            body { background: white; padding: 0; }
            .card { border: 0.1mm solid #eee; }
            #output { display: flex; flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>

<div class="no-print">
    <h1>Karten Filter-Generator</h1>
    <div class="filter-group">
        Von ID: <input type="number" id="id-from" value="1">
    </div>
    <div class="filter-group"
        Bis ID: <input type="number" id="id-to" value="10000">
    </div>
    <button class="btn-generate" onclick="generateFilteredCards()">Anzeigen / Aktualisieren</button>
    <button class="btn-generate" style="background:#444;" onclick="window.print()">🖨️ Drucken</button>
</div>

<div id="output"></div>

<script>
    const YOUR_DOMAIN = window.location.origin + "/DIYHitster/index.html"; 
    let allPlaylists = {};

    async function init() {
        try {
            const res = await fetch('songs.json');
            allPlaylists = await res.json();
        } catch (e) { console.error("JSON Fehler", e); }
    }

    function generateFilteredCards() {
        const from = parseInt(document.getElementById('id-from').value);
        const to = parseInt(document.getElementById('id-to').value);
        const output = document.getElementById('output');
        output.innerHTML = ""; 

        for (const playlistName in allPlaylists) {
            const playlist = allPlaylists[playlistName];
            // Wir holen die Farbe für die Jahreszahl (Standard: Orange, falls nichts definiert ist)
            const yearColor = playlist.color || "#ff5500";

            for (const id in playlist) {
                if (id === "color") continue;

                const numericId = parseInt(id);
                if (!isNaN(numericId) && numericId >= from && numericId <= to) {
                    const song = playlist[id];
                    const pair = document.createElement('div');
                    pair.className = 'card-pair';

                    pair.innerHTML = `
                        <div class="card front">
                            <div class="qr-wrapper" id="qr-${id}"></div>
                        </div>
                        <div class="card back" style="background-image: url('TITEL+JAHRESZAHL_SEITE.png');">
                            <div class="info-title">${song.title}</div>
                            <div class="info-artist">${song.artist}</div>
                            <div class="info-year" style="color: ${yearColor};">${song.year}</div>
                            <div class="info-label">Original-Erstausgabe</div>
                        </div>
                    `;
                    output.appendChild(pair);

                    new QRCode(document.getElementById(`qr-${id}`), {
                        text: `${YOUR_DOMAIN}?id=${id}`,
                        width: 120, height: 120,
                        colorDark : "#000000", colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });
                }
            }
        }
    }
    init();
</script>
</body>
</html>

</html>
