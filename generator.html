<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>HITSTER DIY - Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #222; color: white; padding: 20px; }
        .no-print { background: #333; padding: 25px; border-radius: 15px; margin-bottom: 30px; text-align: center; border: 1px solid #444; }
        .filter-group { display: inline-block; margin: 10px 20px; }
        input { padding: 8px; border-radius: 5px; border: 1px solid #ff5500; background: #444; color: white; width: 80px; text-align: center; }
        .btn-generate { background: #ff5500; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        /* Karten-Layout */
        .card-pair { display: flex; flex-direction: row; gap: 0; margin-bottom: 40px; justify-content: center; page-break-inside: avoid; }
        .card { width: 380px; height: 380px; position: relative; background-size: cover; background-position: center; border: 1px solid #444; }
        .front { background-image: url('QR-CODE-SEITE.png'); background-color: #000; }
        .back { background-image: url('TITEL+JAHRESZAHL_SEITE.png'); background-color: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 50px; box-sizing: border-box; text-align: center; }
        
        .qr-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 8px; border-radius: 8px; }
        
        /* Texte auf der Rückseite */
        .info-title { font-size: 22px; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; text-shadow: 0 2px 4px #000; z-index: 2; }
        .info-artist { font-size: 18px; color: #ff5500; font-weight: bold; margin-bottom: 20px; text-shadow: 0 2px 4px #000; z-index: 2; }
        .info-year { font-size: 70px; font-weight: 900; color: #fff; line-height: 1; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); z-index: 2; }

        @media print { .no-print { display: none; } body { background: white; padding: 0; } }
    </style>
</head>
<body>

<div class="no-print">
    <h1>Karten Filter-Generator</h1>
    <div class="filter-group">Von ID: <input type="number" id="id-from" value="100"></div>
    <div class="filter-group">Bis ID: <input type="number" id="id-to" value="222"></div>
    <button class="btn-generate" onclick="generateFilteredCards()">Anzeigen / Aktualisieren</button>
</div>

<div id="output"></div>

<script>
    let allPlaylists = {};

    async function init() {
        try {
            // Lade Daten von deiner GitHub URL
            const res = await fetch('https://emigei.github.io/DIYHitster/songs.json');
            allPlaylists = await res.json();
            console.log("Songs geladen!");
        } catch (e) {
            console.error("Fehler beim Laden der JSON", e);
        }
    }

    function generateFilteredCards() {
        const from = parseInt(document.getElementById('id-from').value);
        const to = parseInt(document.getElementById('id-to').value);
        const output = document.getElementById('output');
        output.innerHTML = ""; 

        for (const playlistName in allPlaylists) {
            const playlist = allPlaylists[playlistName];
            const yearColor = playlist.color || "#ff5500";

            // Wir gehen durch die Schlüssel (IDs) des Objekts
            for (const id in playlist) {
                if (id === "color") continue;

                const numericId = parseInt(id);
                if (!isNaN(numericId) && numericId >= from && numericId <= to) {
                    const song = playlist[id];
                    const pair = document.createElement('div');
                    pair.className = 'card-pair';
                    
                    pair.innerHTML = `
                        <div class="card front">
                            <div class="qr-wrapper" id="qr-${id}"></div>
                            <div style="position:absolute; bottom:10px; color:black; font-size:8px; width:100%; text-align:center;">
                                Link: ${song.url}
                            </div>
                        </div>
                        <div class="card back">
                            <div class="info-title">${song.title}</div>
                            <div class="info-artist">${song.artist}</div>
                            <div class="info-year" style="color: ${yearColor};">${song.year}</div>
                        </div>
                    `;
                    output.appendChild(pair);

                    // QR-Code führt direkt zum SoundCloud Link aus deiner JSON
                    new QRCode(document.getElementById(`qr-${id}`), {
                        text: song.url,
                        width: 150,
                        height: 150,
                        colorDark : "#000000",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });
                }
            }
        }
    }
    init();
</script>
</body>
</html>
