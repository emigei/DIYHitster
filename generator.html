<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>HITSTER DIY - 6.5cm Fix (10 Paare auf 20x30)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #222; color: white; margin: 0; padding: 20px; }
        .no-print { background: #333; padding: 25px; border-radius: 15px; margin-bottom: 30px; text-align: center; border: 1px solid #444; }
        #output { display: flex; flex-direction: column; align-items: center; }

        /* Das Blatt: 20x30cm Fotopapier */
        .print-sheet {
            width: 20cm;
            height: 30cm;
            background: white;
            position: relative;
            margin-bottom: 40px;
            page-break-after: always;
            overflow: hidden;
        }

        /* Spalte 1: 13cm breit (2x6.5), 26cm hoch (4x6.5) */
        .main-grid {
            position: absolute;
            top: 0; left: 0;
            width: 13cm;
            height: 26cm;
            display: flex;
            flex-wrap: wrap;
        }

        /* Spalte 2: Der 7cm breite Reststreifen rechts */
        .side-grid {
            position: absolute;
            top: 0; left: 13cm;
            width: 7cm;
            height: 30cm;
        }

        .card-pair { 
            display: flex; 
            width: 13cm; 
            height: 6.5cm; 
            outline: 0.1mm solid #ddd;
        }

        /* Die 2 zusätzlichen Paare: gedreht und untereinander */
        .card-pair.rotated {
            position: absolute;
            transform: rotate(90deg);
            transform-origin: top left;
            left: 6.5cm; /* Schiebt das 13cm breite Paar in den rechten 7cm Streifen */
        }

        .card {
            width: 6.5cm; 
            height: 6.5cm; 
            position: relative;
            background-size: cover; 
            background-position: center;
            -webkit-print-color-adjust: exact; 
        }

        .front { background-image: url('QR-CODE-SEITE.png'); }
        .back { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            padding: 15px; box-sizing: border-box; text-align: center; background-size: cover;
            position: relative;
        }

        .qr-wrapper {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 5px; border-radius: 8px; display: flex;
        }

        .info-title { font-size: 14px; font-weight: bold; width: 95%; margin-bottom: 3px; text-transform: uppercase; text-shadow: 0 1px 3px #000; overflow-wrap: break-word; line-height: 1.1; z-index: 2; color: white;}
        .info-artist { font-size: 11px; color: #ff5500; width: 90%; font-weight: bold; margin-bottom: 10px; text-shadow: 0 1px 3px #000; overflow-wrap: break-word; z-index: 2;}
        .info-year { font-size: 48px; font-weight: 900; color: #fff; margin: 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); line-height: 1; z-index: 2;}
        .info-label { font-size: 7px; text-transform: uppercase; color: #bbb; margin-top: 3px; z-index: 2;}

        @media print {
            .no-print { display: none; }
            body { background: white; padding: 0; margin: 0; }
            .print-sheet { margin: 0; box-shadow: none; }
            @page { size: 20cm 30cm; margin: 0; }
        }
    </style>
</head>
<body>

<div class="no-print">
    <h1>6,5cm Karten (10 Paare / 20x30 Blatt)</h1>
    ID von: <input type="number" id="id-from" value="1">
    bis: <input type="number" id="id-to" value="10">
    <button onclick="generateFilteredCards()" style="background:#ff5500; color:white; border:none; padding:10px; border-radius:8px; cursor:pointer;">Erstellen</button>
    <button onclick="window.print()" style="background:#444; color:white; border:none; padding:10px; border-radius:8px; cursor:pointer;">🖨️ Drucken</button>
</div>

<div id="output"></div>

<script>
    const YOUR_DOMAIN = window.location.origin + "/DIYHitster/index.html"; 
    let allPlaylists = {};

    async function init() {
        try {
            const res = await fetch('songs.json');
            allPlaylists = await res.json();
        } catch (e) { console.error("Fehler", e); }
    }

    function generateFilteredCards() {
        const from = parseInt(document.getElementById('id-from').value);
        const to = parseInt(document.getElementById('id-to').value);
        const output = document.getElementById('output');
        output.innerHTML = ""; 

        let songs = [];
        for (const playlistName in allPlaylists) {
            const playlist = allPlaylists[playlistName];
            const yearColor = playlist.color || "#ff5500";
            for (const id in playlist) {
                if (id === "color") continue;
                if (parseInt(id) >= from && parseInt(id) <= to) {
                    songs.push({id, song: playlist[id], yearColor});
                }
            }
        }

        for (let i = 0; i < songs.length; i += 6) {
            const sheet = document.createElement('div');
            sheet.className = 'print-sheet';
            
            const mainGrid = document.createElement('div');
            mainGrid.className = 'main-grid';
            
            const sideGrid = document.createElement('div');
            sideGrid.className = 'side-grid';

            sheet.appendChild(mainGrid);
            sheet.appendChild(sideGrid);
            output.appendChild(sheet);

            for (let j = 0; j < 10 && (i + j) < songs.length; j++) {
                const item = songs[i + j];
                const pair = document.createElement('div');
                
                if (j < 8) {
                    pair.className = 'card-pair';
                    mainGrid.appendChild(pair);
                } else {
                    pair.className = 'card-pair rotated';
                    // Das erste gedrehte Paar bei 0cm, das zweite bei 13.5cm (Höhe)
                    pair.style.top = (j === 8 ? "0cm" : "13.5cm"); 
                    sideGrid.appendChild(pair);
                }

                pair.innerHTML = `
                    <div class="card front"><div class="qr-wrapper" id="qr-${item.id}"></div></div>
                    <div class="card back" style="background-image: url('TITEL+JAHRESZAHL_SEITE.png');">
                        <div class="info-title">${item.song.title}</div>
                        <div class="info-artist">${item.song.artist}</div>
                        <div class="info-year" style="color: ${item.yearColor};">${item.song.year}</div>
                        <div class="info-label">DIY EDITION</div>
                    </div>
                `;
                
                new QRCode(document.getElementById(`qr-${item.id}`), {
                    text: `${YOUR_DOMAIN}?id=${item.id}`,
                    width: 150, height: 150,
                    colorDark : "#000000", colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            }
        }
    }
    init();
</script>
</body>
</html>
