<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>HITSTER DIY - 7x7cm Karten (20x30 Print)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #222; color: white; margin: 0; padding: 20px; }

        .no-print { 
            background: #333; padding: 25px; border-radius: 15px; 
            margin-bottom: 30px; text-align: center; border: 1px solid #444; 
        }

        .filter-group { display: inline-block; margin: 10px 20px; }
        input { 
            padding: 8px; border-radius: 5px; border: 1px solid #ff5500; 
            background: #444; color: white; width: 60px; text-align: center;
        }

        .btn-generate { 
            background: #ff5500; color: white; border: none; padding: 10px 20px; 
            border-radius: 8px; font-weight: bold; cursor: pointer; margin-left: 10px;
        }

        #output { display: flex; flex-direction: column; align-items: center; }

        /* Das Blatt: 20x30cm Fotopapier */
        .print-sheet {
            width: 20cm;
            height: 30cm;
            background: white;
            display: flex;
            flex-wrap: wrap; /* Erlaubt die 2 Spalten */
            align-content: flex-start;
            justify-content: flex-start;
            padding: 0;
            margin-bottom: 40px;
            page-break-after: always;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Ein Paar: 14cm breit (7+7), 7cm hoch */
        .card-pair { 
            display: flex; 
            flex-direction: row; 
            width: 14cm;
            height: 7cm;
            gap: 0; 
            margin: 0;
            /* Ganz zarte Hilfslinie zum Schneiden */
            outline: 0.1mm solid rgba(0,0,0,0.05); 
        }

        .card {
            width: 7cm; 
            height: 7cm; 
            position: relative;
            background-size: cover; 
            background-position: center;
            -webkit-print-color-adjust: exact; 
            print-color-adjust: exact;
        }

        .front { 
            background-image: url('QR-CODE-SEITE.png'); 
            background-color: #333;
        }

        .back { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 18px; 
            box-sizing: border-box; 
            text-align: center;
            position: relative;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }

        .qr-wrapper {
            position: absolute; top: 49.5%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 7px; border-radius: 8px; display: flex;
        }

        /* Text-Styling für 7cm Karte */
        .info-title, .info-artist, .info-year, .info-label { position: relative; z-index: 2; }

        .info-title { 
            font-size: 16px; 
            font-weight: bold; 
            width: 100%; 
            margin-bottom: 4px; 
            text-transform: uppercase; 
            text-shadow: 0 1px 4px #000; 
            overflow-wrap: break-word; 
            line-height: 1.1; 
        }

        .info-artist { 
            font-size: 13px; 
            color: #ff5500; 
            width: 90%; 
            font-weight: bold; 
            margin-bottom: 12px; 
            text-shadow: 0 1px 4px #000; 
            overflow-wrap: break-word; 
        }

        .info-year { font-size: 52px; font-weight: 900; color: #fff; margin: 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); line-height: 1; }
        .info-label { font-size: 8px; text-transform: uppercase; color: #bbb; margin-top: 4px; letter-spacing: 0.8px; }

        @media print {
            .no-print { display: none; }
            body { background: white; padding: 0; margin: 0; }
            .print-sheet { margin: 0; box-shadow: none; border: none; }
            @page { size: 20cm 30cm; margin: 0; }
        }
    </style>
</head>
<body>

<div class="no-print">
    <h1>HITSTER DIY - 7x7cm (20x30 Print)</h1>
    <div class="filter-group">
        Von ID: <input type="number" id="id-from" value="1">
    </div>
    <div class="filter-group">
        Bis ID: <input type="number" id="id-to" value="8">
    </div>
    <button class="btn-generate" onclick="generateFilteredCards()">Karten erstellen</button>
    <button class="btn-generate" style="background:#444;" onclick="window.print()">🖨️ Drucken (20x30)</button>
</div>

<div id="output"></div>

<script>
    const YOUR_DOMAIN = window.location.origin + "/DIYHitster/index.html"; 
    let allPlaylists = {};

    async function init() {
        try {
            const res = await fetch('songs.json');
            allPlaylists = await res.json();
        } catch (e) { console.error("JSON Fehler", e); }
    }

    function generateFilteredCards() {
        const from = parseInt(document.getElementById('id-from').value);
        const to = parseInt(document.getElementById('id-to').value);
        const output = document.getElementById('output');
        output.innerHTML = ""; 

        let currentSheet = null;
        let count = 0;

        for (const playlistName in allPlaylists) {
            const playlist = allPlaylists[playlistName];
            const yearColor = playlist.color || "#ff5500";

            for (const id in playlist) {
                if (id === "color") continue;
                const numericId = parseInt(id);

                if (!isNaN(numericId) && numericId >= from && numericId <= to) {
                    // Neues Blatt alle 8 Paare (2 Spalten x 4 Zeilen)
                    if (count % 8 === 0) {
                        currentSheet = document.createElement('div');
                        currentSheet.className = 'print-sheet';
                        output.appendChild(currentSheet);
                    }

                    const song = playlist[id];
                    const pair = document.createElement('div');
                    pair.className = 'card-pair';

                    pair.innerHTML = `
                        <div class="card front">
                            <div class="qr-wrapper" id="qr-${id}"></div>
                        </div>
                        <div class="card back" style="background-image: url('TITEL+JAHRESZAHL_SEITE.png');">
                            <div class="info-title">${song.title}</div>
                            <div class="info-artist">${song.artist}</div>
                            <div class="info-year" style="color: ${yearColor};">${song.year}</div>
                            <div class="info-label">DIY EDITION</div>
                        </div>
                    `;
                    currentSheet.appendChild(pair);

                    new QRCode(document.getElementById(`qr-${id}`), {
                        text: `${YOUR_DOMAIN}?id=${id}`,
                        width: 170, height: 170,
                        colorDark : "#000000", colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });
                    count++;
                }
            }
        }
    }
    init();
</script>
</body>
</html>
