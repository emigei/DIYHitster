<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HITSTER DIY</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --spotify-green: #1DB954; --bg-dark: #090909; --glass: rgba(255, 255, 255, 0.1); }
        body { 
            font-family: 'Inter', sans-serif; background: radial-gradient(circle at top, #1e1e1e 0%, #000 100%);
            color: white; display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; overflow-x: hidden;
        }
        .card {
            background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px; padding: 30px; width: 85%; max-width: 350px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .card-number {
            display: inline-block; background: var(--spotify-green); color: black;
            font-weight: 900; padding: 4px 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.8rem;
        }
        #play-btn {
            background: var(--spotify-green); color: black; border: none; width: 80px; height: 80px;
            border-radius: 50%; font-size: 2rem; cursor: pointer; margin: 20px auto;
            box-shadow: 0 0 20px rgba(29, 185, 84, 0.4);
        }
        #scan-btn {
            background: transparent; color: white; border: 1px solid white;
            padding: 10px 20px; border-radius: 50px; cursor: pointer; margin-top: 20px; font-size: 0.8rem; opacity: 0.7;
        }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; display: none; margin-top: 10px; }
        #player-container { display: none; width: 100%; }
        iframe { border-radius: 12px; border: none; }
    </style>
</head>
<body>

<div class="card">
    <div id="ui-initial">
        <div class="card-number" id="card-label">BEREIT</div>
        <h1 id="main-title">Hitster DIY</h1>
        <p id="instruction">Karte scannen oder ID laden</p>
        
        <div id="playback-area" style="display: none;">
            <button id="play-btn" onclick="startPlayback()">▶</button>
        </div>
    </div>

    <div id="player-container" style="display:none; width:100%;">
        <div class="card-number">MUSIK LÄDT...</div>
        <div style="position: relative; margin-top: 10px;">
            <div id="cover-mask" style="position:absolute; top:0; left:0; width:100%; height:65px; background:#282828; z-index:10; border-radius:12px 12px 0 0; display:flex; align-items:center; justify-content:center; font-size:11px; color:#1DB954; font-weight:bold; pointer-events:none;">
                🔒 TITEL VERDECKT
            </div>
            
            <iframe id="spotify-frame" 
                    src="" 
                    width="100%" 
                    height="352" 
                    frameBorder="0" 
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                    style="border-radius:12px;">
            </iframe>
        </div>
        <p style="font-size: 0.7rem; color: #555; margin-top: 10px;">Falls Musik nicht startet: Play im Player drücken</p>
    </div>

    <div id="reader"></div>
    <button id="scan-btn" onclick="toggleScanner()">📷 NEUE KARTE SCANNEN</button>
</div>

<script>
    let trackUrl = "";
    let html5QrCode;

    async function loadSongById(id) {
        if(!id) return;
        document.getElementById('card-label').innerText = "KARTE #" + id;
        try {
            const res = await fetch('songs.json');
            const data = await res.json();
            if(data[id]) {
                trackUrl = `https://open.spotify.com/embed/track/${data[id]}?utm_source=generator&autoplay=1`;
                document.getElementById('playback-area').style.display = 'block';
                document.getElementById('instruction').innerText = "Tippe zum Abspielen";
                // Player verstecken falls er noch offen war
                document.getElementById('player-container').style.display = 'none';
                document.getElementById('ui-initial').style.display = 'block';
            }
        } catch(e) { console.error("JSON Fehler", e); }
    }

    function startPlayback() {
        if(!trackUrl) return;
        document.getElementById('ui-initial').style.display = 'none';
        document.getElementById('player-container').style.display = 'block';
        document.getElementById('spotify-frame').src = trackUrl;
    }

    function toggleScanner() {
        const readerDiv = document.getElementById('reader');
        if (readerDiv.style.display === 'block') {
            stopScanner();
        } else {
            startScanner();
        }
    }

    function startScanner() {
        document.getElementById('reader').style.display = 'block';
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
                // Erwartet URL Format: ...?id=123
                const url = new URL(decodedText);
                const newId = url.searchParams.get("id");
                if(newId) {
                    stopScanner();
                    loadSongById(newId);
                }
            },
            (errorMessage) => { /* Scan läuft... */ }
        ).catch(err => alert("Kamera-Fehler: " + err));
    }

    function stopScanner() {
        if(html5QrCode) {
            html5QrCode.stop().then(() => {
                document.getElementById('reader').style.display = 'none';
            });
        }
    }

    // Initialen Song laden falls ID in URL
    const params = new URLSearchParams(window.location.search);
    if(params.get('id')) loadSongById(params.get('id'));
</script>

</body>
</html>
