<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HITSTER DIY - Ultra-Stable1</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --orange: #ff5500; --bg: #121212; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { background: #1e1e1e; border-radius: 24px; padding: 25px; width: 100%; max-width: 350px; text-align: center; border: 1px solid #333; position: relative; }
        
        /* DER CLIPPER */
        #clipper {
            margin: 20px auto; 
            overflow-x: auto; 
            overflow-y: hidden;
            border: 4px solid var(--orange); 
            background: #000;
            transition: all 0.3s ease;
            position: relative;
        }

        /* Setup-Modus: Deine Maße */
        .clipper-setup { width: 310px; height: 220px; border-radius: 12px; overflow-x: auto !important; }
        
        /* Play-Modus: Dein winziges Guckloch */
        .clipper-play { width: 50px; height: 50px; border-radius: 50%; overflow: hidden !important; }

        /* IFRAME: Festgeankert auf 600px Breite gegen Verschieben */
        #sc-frame {
            position: absolute;
            width: 600px; 
            height: 220px;
            border: none;
        }

        .frame-pos-setup { top: 0; left: 0; }
        /* Deine exakten Styling-Punkte */
        .frame-pos-play { top: -7px; left: -5px; } 

        .action-btn { background: var(--orange); color: white; border: none; width: 100%; padding: 18px; border-radius: 50px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .dev-skip { position: absolute; top: 10px; right: 10px; background: transparent; border: none; color: #444; font-size: 10px; }
    </style>
</head>
<body>

<div class="card">
    <button class="dev-skip" onclick="manualId()">ID</button>
    <div id="status" style="color:var(--orange); font-weight:bold;">BEREIT</div>
    
    <div id="player-area" style="display:none;">
        <div id="clipper" class="clipper-setup">
            <iframe id="sc-frame" class="frame-pos-setup" scrolling="yes" frameborder="no" allow="autoplay" src=""></iframe>
        </div>
        <button id="mode-btn" class="action-btn" onclick="toggleMode()">TITEL VERSTECKEN</button>
        <p id="hint" style="font-size: 10px; color: #888; margin-top: 5px;">Falls ein Slider kommt: Im Kasten seitlich wischen!</p>
    </div>

    <div id="reader" style="width:100%; border-radius:12px; overflow:hidden; margin-top:15px; display:none;"></div>
    <button class="action-btn" id="scan-btn" onclick="toggleScanner()">📷 KARTE SCANNEN</button>
</div>

<script>
    let html5QrCode;
    let isLocked = false;

    async function loadSong(id) {
        try {
            const res = await fetch('songs.json');
            const songs = await res.json();
            const trackUrl = songs[id];

            if (trackUrl) {
                document.getElementById('status').innerText = "KARTE #" + id;
                document.getElementById('player-area').style.display = "block";
                
                isLocked = false;
                const clipper = document.getElementById('clipper');
                const frame = document.getElementById('sc-frame');
                clipper.className = "clipper-setup";
                frame.className = "frame-pos-setup";
                document.getElementById('mode-btn').innerText = "TITEL VERSTECKEN";
                document.getElementById('hint').style.display = "block";

                // Trick gegen App-Abfrage: Wir bereinigen die URL und nutzen das Widget-Format
                const cleanUrl = trackUrl.split('?')[0];
                frame.src = `https://w.soundcloud.com/player/?url=${encodeURIComponent(cleanUrl)}&visual=false&auto_play=false&show_artwork=false&color=ff5500&sharing=false&download=false&show_playcount=false`;
            }
        } catch (e) { alert("JSON Fehler!"); }
    }

    function toggleMode() {
        const clipper = document.getElementById('clipper');
        const frame = document.getElementById('sc-frame');
        const btn = document.getElementById('mode-btn');

        if (!isLocked) {
            clipper.className = "clipper-play";
            frame.className = "frame-pos-play";
            btn.innerText = "ZUM SLIDER / LOGIN";
            document.getElementById('hint').style.display = "none";
            isLocked = true;
        } else {
            clipper.className = "clipper-setup";
            frame.className = "frame-pos-setup";
            btn.innerText = "TITEL VERSTECKEN";
            document.getElementById('hint').style.display = "block";
            isLocked = false;
        }
    }

    function manualId() {
        const id = prompt("ID:");
        if (id) loadSong(id);
    }

    function toggleScanner() {
        const readerEl = document.getElementById('reader');
        if (readerEl.style.display === 'block') {
            html5QrCode.stop().then(() => { readerEl.style.display = 'none'; });
        } else {
            readerEl.style.display = 'block';
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                try {
                    const url = new URL(text);
                    const id = url.searchParams.get("id");
                    if (id) {
                        html5QrCode.stop().then(() => {
                            document.getElementById('reader').style.display = 'none';
                            loadSong(id);
                        });
                    }
                } catch(e) { alert("Keine gültige ID im QR-Code!"); }
            }, () => {});
        }
    }
</script>
</body>
</html>
