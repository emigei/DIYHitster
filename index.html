<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HITSTER DIY - Ultra-Stable</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --orange: #ff5500; --bg: #121212; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { background: #1e1e1e; border-radius: 24px; padding: 25px; width: 100%; max-width: 350px; text-align: center; border: 1px solid #333; position: relative; }
        
        #status { color: var(--orange); font-weight: bold; margin-bottom: 15px; }

        /* DER CLIPPER (Das Fenster) */
        #clipper {
            width: 80px; height: 80px;
            margin: 20px auto;
            overflow: hidden;
            border-radius: 50%;
            border: 4px solid var(--orange);
            background: #000;
            position: relative;
            display: none; /* Erst beim Laden zeigen */
        }

        /* DER IFRAME (Fest fixiert) */
        #sc-frame {
            position: absolute;
            width: 800px !important; /* Verhindert Responsive-Shifting */
            height: 160px;
            border: none;
            /* HIER POSITION ANPASSEN */
            top: -41px; 
            left: -12px;
        }

        .action-btn { background: var(--orange); color: white; border: none; width: 100%; padding: 18px; border-radius: 50px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-top: 15px; display: none; border: 1px solid #444; }
        .dev-skip { position: absolute; top: 10px; right: 10px; background: transparent; border: none; color: #333; font-size: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <button class="dev-skip" onclick="manualId()">ID</button>
    <div id="status">BEREIT</div>
    
    <div id="clipper">
        <iframe id="sc-frame" scrolling="no" frameborder="no" allow="autoplay" src=""></iframe>
    </div>

    <div id="reader"></div>
    <button class="action-btn" id="scan-btn" onclick="toggleScanner()">📷 KARTE SCANNEN</button>
</div>

<script>
    let html5QrCode;

    async function loadSong(id) {
        try {
            const res = await fetch('songs.json');
            const songs = await res.json();
            const trackUrl = songs[id];

            if (trackUrl) {
                document.getElementById('status').innerText = "KARTE #" + id;
                const clipper = document.getElementById('clipper');
                const frame = document.getElementById('sc-frame');
                
                clipper.style.display = "block";
                // Wir erzwingen das Widget-Layout
                frame.src = `https://w.soundcloud.com/player/?url=${encodeURIComponent(trackUrl)}&visual=false&auto_play=false&show_artwork=false&color=ff5500`;
            }
        } catch (e) { alert("JSON Fehler!"); }
    }

    function manualId() {
        const id = prompt("ID eingeben:");
        if (id) loadSong(id);
    }

    function toggleScanner() {
        const readerEl = document.getElementById('reader');
        if (readerEl.style.display === 'block') {
            html5QrCode.stop().then(() => { readerEl.style.display = 'none'; });
        } else {
            readerEl.style.display = 'block';
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                const id = new URL(text).searchParams.get("id");
                if (id) { 
                    html5QrCode.stop().then(() => { 
                        readerEl.style.display = 'none'; 
                        loadSong(id); 
                    }); 
                }
            }, () => {});
        }
    }

    window.onload = () => {
        const id = new URLSearchParams(window.location.search).get('id');
        if (id) loadSong(id);
    };
</script>
</body>
</html>
