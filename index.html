<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitster DIY Player</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #121212; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            height: 100vh; 
            margin: 0; 
        }
        .container { width: 90%; max-width: 400px; }
        
        .card-id { font-size: 1rem; color: #888; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        
        #play-btn {
            background-color: #1DB954; 
            color: white;
            border: none;
            padding: 25px 50px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(29, 185, 84, 0.3);
            transition: transform 0.2s;
        }
        #play-btn:active { transform: scale(0.95); }

        #player-wrapper {
            display: none;
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }

        /* Die "Tarnkappe" - überdeckt Titel und Cover bei Spotify */
        #cover-up {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px; /* Deckt den oberen Teil des Players ab */
            background-color: #282828;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            color: #1DB954;
            font-weight: bold;
            font-size: 0.9rem;
        }

        iframe { border: none; }
        .error { color: #ff4444; }
    </style>
</head>
<body>

<div class="container">
    <div id="content">
        <p>Wird geladen...</p>
    </div>
</div>

<script>
    async function init() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const contentDiv = document.getElementById('content');

        if (!id) {
            contentDiv.innerHTML = "<h1>DJ Hitster</h1><p>Bitte scanne eine Karte.</p>";
            return;
        }

        try {
            const response = await fetch('songs.json');
            const songs = await response.json();

            if (songs[id]) {
                const spotifyId = songs[id];
                const playerUrl = `https://open.spotify.com/embed/track/${spotifyId}?utm_source=generator&autoplay=1`;

                contentDiv.innerHTML = `
                    <div class="card-id">Karte #${id}</div>
                    <div id="setup-area">
                        <button onclick="startSong('${playerUrl}')" id="play-btn">🎵 ABSPIELEN</button>
                    </div>
                    <div id="player-wrapper">
                        <div id="cover-up">🤫 Titel wird nicht verraten...</div>
                        <iframe id="spotify-frame" src="" width="100%" height="152" allow="autoplay; encrypted-media"></iframe>
                    </div>
                `;
            } else {
                contentDiv.innerHTML = `<h1 class="error">Fehler</h1><p>Karte ${id} nicht gefunden.</p>`;
            }
        } catch (e) {
            contentDiv.innerHTML = `<p class="error">Fehler beim Laden der songs.json</p>`;
        }
    }

    window.startSong = function(url) {
        document.getElementById('setup-area').style.display = 'none';
        document.getElementById('player-wrapper').style.display = 'block';
        document.getElementById('spotify-frame').src = url;
    };

    init();
</script>

</body>
</html>
