<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HITSTER DIY - Bright Vinyl Edition</title>

    <script src="https://w.soundcloud.com/player/api.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --orange: #ff5500;
            --bg: #0d0d0d;
            --card-bg: rgba(22, 22, 22, 0.95);
            --vinyl-gray: #252525;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #202020 0%, #0a0a0a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vinyl-container {
            position: relative;
            width: 550px;
            height: 550px;
            animation: rotateVinyl 10s linear infinite;
        }

        .vinyl-record {
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-radial-gradient(
                circle at center,
                var(--vinyl-gray) 0px,
                var(--vinyl-gray) 1px,
                #333 2px,
                var(--vinyl-gray) 3px
            );
            border-radius: 50%;
            border: 4px solid #444;
            box-shadow: 0 0 40px rgba(255, 85, 0, 0.2),
                        inset 0 0 60px rgba(0,0,0,0.5);
        }

        .vinyl-record::after {
            content: "";
            position: absolute;
            inset: 0;
            background: conic-gradient(
                from 0deg,
                transparent 0%,
                rgba(255,255,255,0.15) 10%,
                transparent 25%,
                transparent 45%,
                rgba(255,255,255,0.15) 50%,
                transparent 75%,
                transparent 100%
            );
            border-radius: 50%;
        }

        .vinyl-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 85, 0, 0.3);
            border-radius: 50%;
        }

        @keyframes rotateVinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes strobo {
            0% { background: #000; }
            50% { background: #b8b7b7; }
            100% { background: #000; }
        }

        body {
            font-family: sans-serif;
            background: var(--bg);
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .card {
            background: var(--card-bg);
            border-radius: 32px;
            padding: 30px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            border: 2px solid #444;
            backdrop-filter: blur(8px);
        }

        #playlist-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            border-radius: 18px;
            padding: 4px 15px;
        }

        .playlist-name-btn {
            background: none;
            border: none;
            color: white;
            flex-grow: 1;
            text-align: left;
            cursor: pointer;
        }

        .playlist-checkbox {
            width: 22px;
            height: 22px;
            appearance: none;
            border: 2px solid var(--orange);
            border-radius: 6px;
        }

        .playlist-checkbox:checked {
            background: var(--orange);
        }

        .hint-box {
            display: none;
            margin-top: 12px;
            padding: 12px;
            border-radius: 14px;
            background: rgba(255, 85, 0, 0.12);
        }

        .action-btn {
            background: var(--orange);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .secondary-btn {
            background: #1d1d1d;
        }
    </style>
</head>
<body id="body">

<div id="setup-screen" class="card">
    <div id="status">Wähle eine Playlist</div>
    <div id="playlist-buttons"></div>

    <button class="action-btn" onclick="startCustomMix()">✓ Auswahl mixen</button>
    <button class="action-btn" onclick="selectAllMixed()">🔀 ALLE MIXEN</button>
</div>

<div id="game-screen" style="display:none;">
    <div class="card">
        <div id="game-status">Bereit</div>

        <div id="player-area" style="display:none;">
            <div id="clipper">
                <iframe
                    id="sc-frame"
                    scrolling="yes"
                    frameborder="no"
                    allow="autoplay"
                    src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/1&show_artwork=false">
                </iframe>
            </div>

            <button id="mode-btn" class="action-btn" onclick="toggleMode()">
                Titel verstecken
            </button>

            <button class="action-btn secondary-btn" onclick="openPremiumBlind()">
                Premium blind öffnen
            </button>

            <div id="auth-hint" class="hint-box"></div>
        </div>

        <div id="reader" style="display:none;"></div>

        <button class="action-btn" onclick="toggleScanner()">
            📷 Karte Scannen
        </button>
    </div>
</div>

<script>
let html5QrCode;
let isLocked = false;
let scWidget;
let allPlaylists = {};
let currentPlaylistData = null;
let currentSongUrl = null;
let pendingPlayerRefresh = false;
let lastAuthRefreshAt = 0;

const AUTH_REFRESH_DEBOUNCE_MS = 1500;

window.onload = async () => {
    scWidget = SC.Widget(document.getElementById("sc-frame"));
    registerAuthRefreshHandlers();

    try {
        const res = await fetch("songs.json");
        allPlaylists = await res.json();
        setupPlaylistMenu();

        const urlParams = new URLSearchParams(window.location.search);
        const songId = urlParams.get("id");

        if (songId) {
            const savedMix = localStorage.getItem("hitster_mix");

            if (savedMix) {
                currentPlaylistData = JSON.parse(savedMix);
                startGame("Modus: Mix geladen");
                loadSong(songId);
            } else {
                selectAllMixed();
                loadSong(songId);
            }
        }
    } catch {
        document.getElementById("status").innerText =
            "Fehler beim Laden!";
    }
};

function saveAndStart(data, title) {
    currentPlaylistData = data;
    localStorage.setItem("hitster_mix", JSON.stringify(data));
    startGame(title);
}

function selectPlaylist(name) {
    saveAndStart(allPlaylists[name], "Modus: " + name);
}

function startGame(text) {
    document.getElementById("setup-screen").style.display = "none";
    document.getElementById("game-screen").style.display = "block";
    document.getElementById("game-status").innerText = text;
}

function loadSong(id) {
    if (!currentPlaylistData) selectAllMixed();

    const song = currentPlaylistData[id];

    if (!song) {
        alert("Song nicht gefunden");
        return;
    }

    currentSongUrl = song.url;
    document.getElementById("player-area").style.display = "block";

    loadCurrentSongIntoWidget(true);
}

function loadCurrentSongIntoWidget(forceRefresh = false) {
    if (!currentSongUrl || !scWidget) return;

    scWidget.load(currentSongUrl, {
        visual: false,
        auto_play: true,
        show_artwork: false,
        color: "ff5500"
    });

    if (forceRefresh) {
        const frame = document.getElementById("sc-frame");
        frame.src = buildSoundCloudEmbedUrl(
            currentSongUrl,
            Date.now()
        );
        scWidget = SC.Widget(frame);
    }
}

function buildSoundCloudEmbedUrl(songUrl, cacheBuster) {
    const params = new URLSearchParams({
        url: songUrl,
        show_artwork: "false",
        auto_play: "true",
        color: "ff5500"
    });

    params.set("t", cacheBuster);

    return `https://w.soundcloud.com/player/?${params}`;
}

function registerAuthRefreshHandlers() {
    window.addEventListener("focus", maybeRefreshPlayerAuth);
    window.addEventListener("pageshow", maybeRefreshPlayerAuth);
}

function maybeRefreshPlayerAuth() {
    if (!currentSongUrl) return;

    const now = Date.now();

    if (now - lastAuthRefreshAt < AUTH_REFRESH_DEBOUNCE_MS) {
        return;
    }

    lastAuthRefreshAt = now;

    if (isLocked) {
        pendingPlayerRefresh = true;
        return;
    }

    refreshPlayerAuth();
}

function refreshPlayerAuth() {
    loadCurrentSongIntoWidget(true);
    pendingPlayerRefresh = false;
}

function toggleMode() {
    isLocked = !isLocked;

    document.getElementById("mode-btn").innerText =
        isLocked ? "Titel anzeigen" : "Titel verstecken";

    if (!isLocked && pendingPlayerRefresh) {
        refreshPlayerAuth();
    }
}

function openPremiumBlind() {
    if (!currentSongUrl) {
        alert("Kein Track geladen");
        return;
    }

    window.open(currentSongUrl, "_blank");
}

function toggleScanner() {
    const reader = document.getElementById("reader");

    if (reader.style.display === "block") {
        html5QrCode.stop().then(() => {
            reader.style.display = "none";
        });
        return;
    }

    reader.style.display = "block";
    html5QrCode = new Html5Qrcode("reader");

    html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (text) => {
            try {
                const url = new URL(text);
                const id = url.searchParams.get("id");

                if (id) {
                    html5QrCode.stop().then(() => {
                        reader.style.display = "none";
                        loadSong(id);
                    });
                }
            } catch {
                alert("Kein gültiger Hitster-Link!");
            }
        }
    );
}
</script>

</body>
</html>
