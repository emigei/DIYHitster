<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HITSTER DIY - Fix</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --orange: #ff5500; --bg: #121212; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        .card { background: #1e1e1e; border-radius: 24px; padding: 25px; width: 100%; max-width: 350px; text-align: center; border: 1px solid #333; }
        
        /* DYNAMISCHES GUCKLOCH */
        #clipper {
            margin: 20px auto; 
            overflow: hidden; 
            border: 4px solid var(--orange); 
            background: #000;
            transition: all 0.3s ease; /* Weicher Übergang */
            display: none;
            position: relative;
        }

        /* Modus 1: Setup (Groß, um Blockaden zu lösen) */
        .clipper-setup {
            width: 300px; height: 180px; 
            border-radius: 12px;
        }

        /* Modus 2: Play (Klein & Rund, um Titel zu verstecken) */
        .clipper-play {
            width: 85px; height: 85px; 
            border-radius: 50%;
        }

        #sc-frame {
            position: absolute;
            width: 400px; height: 150px;
            border: none;
            transition: all 0.3s ease;
        }

        /* Position im kleinen Guckloch */
        .frame-play { top: -8px; left: -10px; }
        /* Position im Setup-Modus */
        .frame-setup { top: 0; left: 0; }

        .action-btn { background: var(--orange); color: white; border: none; width: 100%; padding: 18px; border-radius: 50px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-top: 15px; display: none; }
        .scan-trigger { background: transparent; color: #888; border: 1px solid #444; padding: 15px; border-radius: 50px; width: 100%; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <div id="display-id" style="color:var(--orange); font-weight:bold;">BEREIT</div>
    
    <div id="player-area" style="display:none;">
        <div id="clipper" class="clipper-setup">
            <iframe id="sc-frame" class="frame-setup" scrolling="no" frameborder="no" allow="autoplay" src=""></iframe>
        </div>
        
        <button id="hide-btn" class="action-btn" onclick="lockAndPlay()">Titel verstecken & Start</button>
        <button id="reset-btn" class="scan-trigger" onclick="unlockPlayer()" style="display:none;">Player zeigen (Fix)</button>
    </div>

    <div id="reader"></div>
    <button class="scan-trigger" onclick="toggleScanner()">📷 KARTE SCANNEN</button>
    
    <div style="margin-top:20px;">
        <a href="https://soundcloud.com/login" target="_blank" style="color:#666; font-size:10px;">Login / Blockade-Check</a>
    </div>
</div>

<script>
    let html5QrCode;
    let currentTrackUrl = "";

    async function loadSongData(id) {
        try {
            const res = await fetch('songs.json');
            const songs = await res.json();
            if (songs[id]) {
                currentTrackUrl = songs[id];
                document.getElementById('display-id').innerText = "KARTE #" + id;
                document.getElementById('player-area').style.display = 'block';
                unlockPlayer(); // Erstmal groß anzeigen für Privacy Badger
                
                const frame = document.getElementById('sc-frame');
                frame.src = `https://w.soundcloud.com/player/?url=${encodeURIComponent(currentTrackUrl)}&visual=false&auto_play=false`;
            }
        } catch (e) { alert("Fehler!"); }
    }

    function unlockPlayer() {
        const clipper = document.getElementById('clipper');
        const frame = document.getElementById('sc-frame');
        clipper.style.display = "block";
        clipper.className = "clipper-setup";
        frame.className = "frame-setup";
        document.getElementById('hide-btn').style.display = "block";
        document.getElementById('reset-btn').style.display = "none";
    }

    function lockAndPlay() {
        const clipper = document.getElementById('clipper');
        const frame = document.getElementById('sc-frame');
        
        // Jetzt klein machen
        clipper.className = "clipper-play";
        frame.className = "frame-play";
        
        document.getElementById('hide-btn').style.display = "none";
        document.getElementById('reset-btn').style.display = "block";
        
        // Play-Befehl triggern (funktioniert nur wenn User klickt)
        // Das Widget braucht hier oft den manuellen Klick im Guckloch
    }

    function toggleScanner() {
        const readerEl = document.getElementById('reader');
        if (readerEl.style.display === 'block') {
            html5QrCode.stop().then(() => { readerEl.style.display = 'none'; });
        } else {
            readerEl.style.display = 'block';
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                const url = new URL(text);
                const id = url.searchParams.get("id");
                if (id) {
                    html5QrCode.stop().then(() => {
                        document.getElementById('reader').style.display = 'none';
                        loadSongData(id);
                    });
                }
            }, () => {});
        }
    }
</script>
</body>
</html>
