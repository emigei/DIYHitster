<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HITSTER DIY</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --green: #1DB954; --bg: #121212; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { background: #1e1e1e; border-radius: 20px; padding: 25px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333; }
        .card-id { color: var(--green); font-weight: bold; margin-bottom: 15px; letter-spacing: 1px; }
        #player-area { display: none; margin-top: 20px; min-height: 160px; }
        #big-play-btn { background: var(--green); color: black; border: none; width: 100%; padding: 25px; border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3); }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin: 15px 0; display: none; border: 2px solid #444; }
        .scan-btn { background: transparent; color: #aaa; border: 1px solid #444; padding: 15px; border-radius: 12px; width: 100%; cursor: pointer; margin-top: 20px; font-size: 0.9rem; }
        .mask { position: absolute; top: 0; left: 0; width: 100%; height: 80px; background: #282828; z-index: 10; border-radius: 12px 12px 0 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #888; border-bottom: 1px solid #121212; }
        #spotify-container { position: relative; border-radius: 12px; overflow: hidden; height: 152px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <div class="card-id" id="display-id">BEREIT</div>
    <h2 id="title">Hitster DIY</h2>
    
    <div id="player-area">
        <button id="big-play-btn" onclick="activatePlayer()">▶ SONG ABSPIELEN</button>
        
        <div id="spotify-container">
            <div class="mask">🔒 TITEL VERDECKT</div>
            <iframe id="spotify-frame" src="" width="100%" height="152" frameborder="0" allow="autoplay; encrypted-media"></iframe>
        </div>
    </div>

    <div id="reader"></div>
    <button class="scan-btn" onclick="toggleScanner()">📷 KARTE SCANNEN</button>
</div>

<script>
    let html5QrCode;
    let trackId = "";

    async function loadSong(id) {
        try {
            const res = await fetch('songs.json');
            const songs = await res.json();
            if (songs[id]) {
                trackId = songs[id];
                document.getElementById('display-id').innerText = "KARTE #" + id;
                document.getElementById('title').style.display = 'none';
                document.getElementById('player-area').style.display = 'block';
                document.getElementById('spotify-container').style.display = 'none';
                document.getElementById('big-play-btn').style.display = 'block';
                document.getElementById('spotify-frame').src = ""; // Reset
            }
        } catch (e) { alert("songs.json nicht gefunden!"); }
    }

    function activatePlayer() {
        if (!trackId) return;
        const frame = document.getElementById('spotify-frame');
        // Wir laden den Player erst HIER durch den Klick
        frame.src = `https://open.spotify.com/embed/track/${trackId}?utm_source=generator&autoplay=1`;
        
        document.getElementById('big-play-btn').style.display = 'none';
        document.getElementById('spotify-container').style.display = 'block';
    }

    function toggleScanner() {
        const readerEl = document.getElementById('reader');
        if (readerEl.style.display === 'block') {
            if(html5QrCode) html5QrCode.stop().then(() => { readerEl.style.display = 'none'; });
        } else {
            readerEl.style.display = 'block';
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                const url = new URL(text);
                const id = url.searchParams.get("id");
                if (id) {
                    html5QrCode.stop().then(() => {
                        document.getElementById('reader').style.display = 'none';
                        loadSong(id);
                    });
                }
            }, () => {}).catch(err => alert("Kamera-Fehler: " + err));
        }
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('id')) loadSong(urlParams.get('id'));
</script>

</body>
</html>
