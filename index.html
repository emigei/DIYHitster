<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HITSTER DIY</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --spotify-green: #1DB954; --bg: #121212; }
        body { 
            font-family: sans-serif; background-color: var(--bg); color: white; 
            margin: 0; display: flex; flex-direction: column; align-items: center; padding: 20px;
        }
        .card {
            background: #1e1e1e; border-radius: 20px; padding: 20px; 
            width: 100%; max-width: 350px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .card-id { color: var(--spotify-green); font-weight: bold; margin-bottom: 15px; }
        
        /* Der Play-Button Bereich */
        #playback-container { display: none; margin: 20px 0; position: relative; }
        
        #big-play-btn {
            background: var(--spotify-green); color: black; border: none;
            width: 100%; padding: 20px; border-radius: 12px; font-size: 1.2rem;
            font-weight: bold; cursor: pointer;
        }

        #spotify-wrapper { display: none; margin-top: 15px; position: relative; }
        
        /* Tarnung für den Titel */
        .mask {
            position: absolute; top: 0; left: 0; width: 100%; height: 80px;
            background: #282828; z-index: 10; border-radius: 12px 12px 0 0;
            display: flex; align-items: center; justify-content: center; font-size: 12px;
        }

        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin: 15px 0; display: none; }
        
        .action-btn {
            background: transparent; color: white; border: 1px solid #555;
            padding: 15px; border-radius: 12px; width: 100%; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="card-id" id="display-id">BEREIT ZUM SCANNEN</div>
    
    <div id="playback-container">
        <button id="big-play-btn" onclick="showPlayer()">🎵 SONG LADEN</button>
        
        <div id="spotify-wrapper">
            <div class="mask">🔒 TITEL VERDECKT</div>
            <iframe id="spotify-frame" src="" width="100%" height="152" frameborder="0" allow="autoplay; encrypted-media"></iframe>
        </div>
    </div>

    <div id="reader"></div>
    <button class="action-btn" onclick="toggleScanner()">📷 KARTE SCANNEN</button>
</div>

<script>
    let html5QrCode;
    let currentTrackId = "";

    // 1. Song Daten laden
    async function loadSong(id) {
        try {
            const res = await fetch('songs.json');
            const data = await res.json();
            if (data[id]) {
                currentTrackId = data[id];
                document.getElementById('display-id').innerText = "KARTE #" + id;
                document.getElementById('playback-container').style.display = 'block';
                document.getElementById('spotify-wrapper').style.display = 'none';
                document.getElementById('big-play-btn').style.display = 'block';
            } else {
                alert("ID nicht in songs.json gefunden!");
            }
        } catch (e) {
            alert("Fehler: songs.json konnte nicht geladen werden.");
        }
    }

    // 2. Player anzeigen
    function showPlayer() {
        const frame = document.getElementById('spotify-frame');
        // Wir bauen den Link erst hier ein
        frame.src = `https://open.spotify.com/embed/track/${currentTrackId}?utm_source=generator&autoplay=1`;
        
        document.getElementById('big-play-btn').style.display = 'none';
        document.getElementById('spotify-wrapper').style.display = 'block';
    }

    // 3. Scanner Funktionen
    function toggleScanner() {
        const readerEl = document.getElementById('reader');
        if (readerEl.style.display === 'block') {
            stopScan();
        } else {
            startScan();
        }
    }

    function startScan() {
        document.getElementById('reader').style.display = 'block';
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: 250 },
            (text) => {
                const url = new URL(text);
                const id = url.searchParams.get("id");
                if (id) {
                    stopScan();
                    loadSong(id);
                }
            },
            () => {} // Ignoriere Scan-Fehler (wenn kein Code im Bild)
        ).catch(err => alert("Kamera-Fehler: " + err));
    }

    function stopScan() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                document.getElementById('reader').style.display = 'none';
            });
        }
    }

    // Check falls ID schon im Link ist beim Starten
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('id')) loadSong(urlParams.get('id'));
</script>

</body>
</html>
