<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HITSTER DIY - Premium Edition</title>
    <script src="https://w.soundcloud.com/player/api.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { 
            --orange: #ff5500; 
            --orange-glow: rgba(255, 85, 0, 0.4);
            --bg: #0a0a0a; 
            --card-bg: #161616;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            color: white; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Hintergrund-Animation für etwas Tiefe */
        body::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 70%);
            z-index: -1;
            animation: rotateBg 20s linear infinite;
        }

        @keyframes rotateBg { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .card { 
            background: var(--card-bg); 
            border-radius: 32px; 
            padding: 30px; 
            width: 90%; 
            max-width: 380px; 
            text-align: center; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            position: relative;
            transition: transform 0.3s ease;
        }

        #status { 
            color: var(--orange); 
            font-weight: 800; 
            letter-spacing: 2px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--orange-glow);
        }

        /* GUCKLOCH MIT GLOW */
        #clipper {
            margin: 25px auto; 
            overflow-x: auto; 
            overflow-y: hidden;
            border: 3px solid var(--orange); 
            background: #000;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Elastischer Effekt */
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5), 0 0 15px var(--orange-glow);
        }

        .clipper-setup { width: 310px; height: 220px; border-radius: 16px; }
        
        .clipper-play { 
            width: 60px; height: 60px; 
            border-radius: 50%; 
            overflow: hidden !important; 
            animation: pulseGlow 2s infinite; /* Pulsieren im kleinen Modus */
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 5px var(--orange); }
            50% { box-shadow: 0 0 20px var(--orange); }
            100% { box-shadow: 0 0 5px var(--orange); }
        }

        #sc-frame {
            position: absolute;
            width: 600px; 
            height: 220px;
            border: none;
            transition: all 0.5s ease;
        }

        .frame-pos-setup { top: 0; left: 0; }
        .frame-pos-play { top: -12px; left: -10px; scale: 1.2; } /* Leicht vergrößert für bessere Bedienung */

        /* BUTTONS */
        .action-btn { 
            background: linear-gradient(135deg, var(--orange) 0%, #ff2a00 100%);
            color: white; 
            border: none; 
            width: 100%; 
            padding: 16px; 
            border-radius: 16px; 
            font-weight: bold; 
            font-size: 1rem;
            cursor: pointer; 
            margin-top: 15px; 
            box-shadow: 0 10px 20px rgba(255, 42, 0, 0.3);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .action-btn:active { transform: scale(0.96); box-shadow: 0 5px 10px rgba(255, 42, 0, 0.2); }

        .secondary-btn {
            background: var(--glass);
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.1);
            margin-top: 15px;
            padding: 12px;
            border-radius: 14px;
            width: 100%;
            cursor: pointer;
            transition: background 0.3s;
        }

        .secondary-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

        #reader { 
            width: 100%; 
            border-radius: 20px; 
            overflow: hidden; 
            margin-top: 20px; 
            border: 2px solid var(--glass);
        }

        .dev-skip { 
            position: absolute; 
            top: 15px; right: 15px; 
            background: none; border: none; 
            color: #444; font-size: 10px; 
            opacity: 0.5;
        }

        #hint { font-size: 11px; color: #666; margin-top: 10px; font-style: italic; }
    </style>
</head>
<body>

<div class="card">
    <button class="dev-skip" onclick="manualId()">DEV_MODE</button>
    <div id="status">Bereit zum Scan</div>
    
    <div id="player-area" style="display:none;">
        <div id="clipper" class="clipper-setup">
            <iframe id="sc-frame" class="frame-pos-setup" scrolling="yes" frameborder="no" allow="autoplay" 
                src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/1&show_artwork=false"></iframe>
        </div>
        <button id="mode-btn" class="action-btn" onclick="toggleMode()">Titel verstecken</button>
        <p id="hint">Slider-Check: Im Kasten wischen</p>
    </div>

    <div id="reader" style="display:none;"></div>
    <button class="action-btn" id="scan-btn" onclick="toggleScanner()" style="margin-top: 25px;">📷 Karte Scannen</button>
</div>

<script>
    let html5QrCode;
    let isLocked = false;
    let scWidget;

    window.onload = () => {
        const frame = document.getElementById('sc-frame');
        scWidget = SC.Widget(frame);
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('id')) loadSong(urlParams.get('id'));
    };

    async function loadSong(id) {
        try {
            const res = await fetch('songs.json');
            const songs = await res.json();
            const trackUrl = songs[id];

            if (trackUrl) {
                document.getElementById('status').innerText = "Karten-ID: #" + id;
                document.getElementById('player-area').style.display = "block";
                
                scWidget.load(trackUrl, {
                    visual: false,
                    auto_play: false,
                    show_artwork: false,
                    color: "ff5500"
                });
            }
        } catch (e) { console.error("Fehler:", e); }
    }

    function toggleMode() {
        const clipper = document.getElementById('clipper');
        const frame = document.getElementById('sc-frame');
        const btn = document.getElementById('mode-btn');

        if (!isLocked) {
            clipper.className = "clipper-play";
            frame.className = "frame-pos-play";
            btn.innerText = "Titel anzeigen";
            document.getElementById('hint').style.display = "none";
            isLocked = true;
        } else {
            clipper.className = "clipper-setup";
            frame.className = "frame-pos-setup";
            btn.innerText = "Titel verstecken";
            document.getElementById('hint').style.display = "block";
            isLocked = false;
        }
    }

    function manualId() {
        const id = prompt("ID:");
        if (id) loadSong(id);
    }

    function toggleScanner() {
        const readerEl = document.getElementById('reader');
        const btn = document.getElementById('scan-btn');
        if (readerEl.style.display === 'block') {
            html5QrCode.stop().then(() => { 
                readerEl.style.display = 'none'; 
                btn.innerText = "📷 Karte Scannen";
            });
        } else {
            readerEl.style.display = 'block';
            btn.innerText = "Abbrechen";
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                const url = new URL(text);
                const id = url.searchParams.get("id");
                if (id) {
                    html5QrCode.stop().then(() => {
                        document.getElementById('reader').style.display = 'none';
                        btn.innerText = "📷 Karte Scannen";
                        loadSong(id);
                    });
                }
            }, () => {});
        }
    }
</script>
</body>
</html>
