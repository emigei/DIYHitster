<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HITSTER DIY - Rave Edition</title>
    <script src="https://w.soundcloud.com/player/api.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { 
            --orange: #ff5500; 
            --bg: #0a0a0a; 
            --card-bg: #161616;
            --rave-color: #ff5500;
        }

        body { 
            font-family: -apple-system, sans-serif; 
            background: var(--bg); 
            color: white; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh;
            transition: background 0.3s ease;
            overflow: hidden;
        }

        /* RAVE MODE ANIMATIONEN */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-1px, -2px) rotate(-1deg); }
            40% { transform: translate(-3px, 0px) rotate(1deg); }
            60% { transform: translate(3px, 2px) rotate(0deg); }
            80% { transform: translate(1px, -1px) rotate(1deg); }
            100% { transform: translate(-1px, 2px) rotate(-1deg); }
        }

        @keyframes raveColors {
            0% { --rave-color: #ff00ff; border-color: #ff00ff; box-shadow: 0 0 20px #ff00ff; }
            33% { --rave-color: #00ffff; border-color: #00ffff; box-shadow: 0 0 20px #00ffff; }
            66% { --rave-color: #ffff00; border-color: #ffff00; box-shadow: 0 0 20px #ffff00; }
            100% { --rave-color: #ff00ff; border-color: #ff00ff; box-shadow: 0 0 20px #ff00ff; }
        }

        /* Wenn Party Mode aktiv ist */
        body.rave-active { animation: raveBg 0.5s infinite; }
        @keyframes raveBg { 0% { background: #000; } 50% { background: #0a0a0a; } 100% { background: #000; } }
        
        .rave-active .card { animation: shake 0.2s infinite; border-color: var(--rave-color); }
        .rave-active #clipper { animation: raveColors 1s infinite !important; }
        .rave-active .action-btn { animation: raveColors 1s infinite !important; background: var(--rave-color); }

        /* STANDARDS */
        .card { 
            background: var(--card-bg); 
            border-radius: 32px; 
            padding: 25px; 
            width: 90%; 
            max-width: 350px; 
            text-align: center; 
            border: 1px solid #333; 
            position: relative;
            transition: all 0.3s ease;
        }

        #status { color: var(--orange); font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }

        #clipper {
            margin: 20px auto; 
            overflow-x: auto; 
            overflow-y: hidden;
            border: 4px solid var(--orange); 
            background: #000;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .clipper-setup { width: 310px; height: 220px; border-radius: 12px; }
        
        /* DEINE MASSGABEN: 50px */
        .clipper-play { width: 50px; height: 50px; border-radius: 50%; overflow: hidden !important; }

        #sc-frame {
            position: absolute;
            width: 600px; 
            height: 220px;
            border: none;
        }

        .frame-pos-setup { top: 0; left: 0; }
        /* DEINE MASSGABEN: top -7, left -5 */
        .frame-pos-play { top: -7px; left: -5px; } 

        .action-btn { 
            background: var(--orange); 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 18px; 
            border-radius: 50px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px; 
            transition: all 0.2s;
        }

        /* Party Button Styling */
        .party-toggle {
            background: #333;
            font-size: 10px;
            padding: 5px 10px;
            border-radius: 10px;
            border: none;
            color: #777;
            margin-top: 20px;
            cursor: pointer;
        }
        .rave-active .party-toggle { background: var(--rave-color); color: #000; font-weight: bold; }

        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-top: 15px; display: none; }
        .dev-skip { position: absolute; top: 10px; right: 10px; background: transparent; border: none; color: #444; font-size: 10px; }
    </style>
</head>
<body id="body">

<div class="card">
    <button class="dev-skip" onclick="manualId()">DEV</button>
    <div id="status">Bereit</div>
    
    <div id="player-area" style="display:none;">
        <div id="clipper" class="clipper-setup">
            <iframe id="sc-frame" class="frame-pos-setup" scrolling="yes" frameborder="no" allow="autoplay" 
                src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/1&show_artwork=false"></iframe>
        </div>
        <button id="mode-btn" class="action-btn" onclick="toggleMode()">Titel verstecken</button>
    </div>

    <div id="reader"></div>
    <button class="action-btn" id="scan-btn" onclick="toggleScanner()">📷 Karte Scannen</button>
    
    <button class="party-toggle" onclick="toggleRave()">✨ PARTY MODE</button>
</div>

<script>
    let html5QrCode;
    let isLocked = false;
    let scWidget;

    window.onload = () => {
        scWidget = SC.Widget(document.getElementById('sc-frame'));
        const id = new URLSearchParams(window.location.search).get('id');
        if (id) loadSong(id);
    };

    function toggleRave() {
        document.getElementById('body').classList.toggle('rave-active');
    }

    async function loadSong(id) {
        try {
            const res = await fetch('songs.json');
            const songs = await res.json();
            if (songs[id]) {
                document.getElementById('status').innerText = "Track #" + id;
                document.getElementById('player-area').style.display = "block";
                scWidget.load(songs[id], { visual: false, auto_play: false, show_artwork: false, color: "ff5500" });
            }
        } catch (e) { console.error(e); }
    }

    function toggleMode() {
        const clipper = document.getElementById('clipper');
        const frame = document.getElementById('sc-frame');
        const btn = document.getElementById('mode-btn');
        if (!isLocked) {
            clipper.className = "clipper-play";
            frame.className = "frame-pos-play";
            btn.innerText = "Titel anzeigen";
            isLocked = true;
        } else {
            clipper.className = "clipper-setup";
            frame.className = "frame-pos-setup";
            btn.innerText = "Titel verstecken";
            isLocked = false;
        }
    }

    function manualId() { const id = prompt("ID:"); if (id) loadSong(id); }

    function toggleScanner() {
        const readerEl = document.getElementById('reader');
        if (readerEl.style.display === 'block') {
            html5QrCode.stop().then(() => { readerEl.style.display = 'none'; });
        } else {
            readerEl.style.display = 'block';
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                const id = new URL(text).searchParams.get("id");
                if (id) { html5QrCode.stop().then(() => { readerEl.style.display = 'none'; loadSong(id); }); }
            }, () => {});
        }
    }
</script>
</body>
</html>
