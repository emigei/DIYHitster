<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HITSTER DIY - Stabil & Schaltbar</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --orange: #ff5500; --bg: #121212; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { background: #1e1e1e; border-radius: 24px; padding: 25px; width: 100%; max-width: 350px; text-align: center; border: 1px solid #333; position: relative; }
        
        /* DAS GUCKLOCH (DYNAMISCH) */
        #clipper {
            margin: 20px auto; 
            overflow: hidden; 
            border: 4px solid var(--orange); 
            background: #000;
            display: none;
            position: relative;
            transition: all 0.3s ease;
        }

        /* Modus 1: Setup (Groß zum Bestätigen) */
        .clipper-setup { width: 300px; height: 160px; border-radius: 12px; }
        
        /* Modus 2: Play (Klein & Rund) */
        .clipper-play { width: 50px; height: 50px; border-radius: 50%; }

        /* DER STARRE IFRAME */
        #sc-frame {
            position: absolute;
            width: 800px !important; /* Verhindert Shifting */
            height: 160px;
            border: none;
            transition: all 0.3s ease;
        }

        /* Positionierung */
        .frame-pos-setup { top: 0; left: 0; }
        .frame-pos-play { top: -7px; left: -5px; } /* Hier am PC feinjustieren */

        .action-btn { background: var(--orange); color: white; border: none; width: 100%; padding: 18px; border-radius: 50px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-top: 15px; display: none; border: 1px solid #444; }
        .dev-skip { position: absolute; top: 10px; right: 10px; background: transparent; border: none; color: #333; font-size: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <button class="dev-skip" onclick="manualId()">ID</button>
    <div id="status" style="color:var(--orange); font-weight:bold; margin-bottom:10px;">BEREIT</div>
    
    <div id="player-area" style="display:none;">
        <div id="clipper" class="clipper-setup">
            <iframe id="sc-frame" class="frame-pos-setup" scrolling="no" frameborder="no" allow="autoplay" src=""></iframe>
        </div>
        <button id="mode-btn" class="action-btn" onclick="toggleMode()">TITEL VERSTECKEN</button>
    </div>

    <div id="reader"></div>
    <button class="action-btn" id="scan-btn" onclick="toggleScanner()">📷 KARTE SCANNEN</button>
</div>

<script>
    let html5QrCode;
    let isLocked = false;

    // Wir nutzen das SoundCloud Widget API Prinzip
    function loadSong(id) {
    try {
        const res = await fetch('songs.json');
        const songs = await res.json();
        const trackUrl = songs[id];

        if (trackUrl) {
            document.getElementById('status').innerText = "KARTE #" + id;
            document.getElementById('player-area').style.display = "block";
            
            const frame = document.getElementById('sc-frame');
            
            // WICHTIG: Wir ändern nur das 'url' Attribut im src, 
            // anstatt das ganze Iframe-Element neu zu bauen.
            const newSrc = `https://w.soundcloud.com/player/?url=${encodeURIComponent(trackUrl)}&visual=false&auto_play=false&show_artwork=false&color=ff5500`;
            
            if (frame.src !== newSrc) {
                frame.src = newSrc;
            }

            // Zurück in den Setup-Modus, falls man wieder den Badger/Login sieht
            unlockPlayerManually(); 
        }
    } catch (e) { console.error(e); }
}

    function toggleMode() {
        const clipper = document.getElementById('clipper');
        const frame = document.getElementById('sc-frame');
        const btn = document.getElementById('mode-btn');

        if (!isLocked) {
            clipper.className = "clipper-play";
            frame.className = "frame-pos-play";
            btn.innerText = "PLAYER ZEIGEN";
            isLocked = true;
        } else {
            clipper.className = "clipper-setup";
            frame.className = "frame-pos-setup";
            btn.innerText = "TITEL VERSTECKEN";
            isLocked = false;
        }
    }

    function manualId() {
        const id = prompt("ID eingeben:");
        if (id) loadSong(id);
    }

    function toggleScanner() {
        const readerEl = document.getElementById('reader');
        if (readerEl.style.display === 'block') {
            html5QrCode.stop().then(() => { readerEl.style.display = 'none'; });
        } else {
            readerEl.style.display = 'block';
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                const id = new URL(text).searchParams.get("id");
                if (id) { 
                    html5QrCode.stop().then(() => { 
                        readerEl.style.display = 'none'; 
                        loadSong(id); 
                    }); 
                }
            }, () => {});
        }
    }

    window.onload = () => {
        const id = new URLSearchParams(window.location.search).get('id');
        if (id) loadSong(id);
    };
</script>
</body>
</html>
