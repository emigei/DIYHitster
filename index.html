<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HITSTER DIY - Luxury Rave Edition</title>
    <script src="https://w.soundcloud.com/player/api.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { 
            --orange: #ff5500; 
            --orange-glow: rgba(255, 85, 0, 0.4);
            --bg: #0a0a0a; 
            --card-bg: #161616;
            --glass: rgba(255, 255, 255, 0.05);
            --rave-color: var(--orange);
        }

        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg); 
            color: white; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        /* EDLER HINTERGRUND */
        body::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 70%);
            z-index: -1;
            animation: rotateBg 20s linear infinite;
        }
        @keyframes rotateBg { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* RAVE ANIMATIONEN */
        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-2px, 1px); }
            100% { transform: translate(1px, -1px); }
        }
        @keyframes raveColors {
            0% { border-color: #ff00ff; box-shadow: 0 0 20px #ff00ff; }
            33% { border-color: #00ffff; box-shadow: 0 0 20px #00ffff; }
            66% { border-color: #ffff00; box-shadow: 0 0 20px #ffff00; }
            100% { border-color: #ff00ff; box-shadow: 0 0 20px #ff00ff; }
        }

        .rave-active { animation: raveFlash 0.2s infinite !important; }
        @keyframes raveFlash { 0% { background: #000; } 50% { background: #111; } }
        .rave-active .card { animation: shake 0.1s infinite; border-color: white; }
        .rave-active #clipper { animation: raveColors 0.5s infinite !important; }

        /* CARD STYLING */
        .card { 
            background: var(--card-bg); 
            border-radius: 32px; 
            padding: 30px; 
            width: 90%; 
            max-width: 380px; 
            text-align: center; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            position: relative;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #status { 
            color: var(--orange); 
            font-weight: 800; 
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--orange-glow);
        }

        /* GUCKLOCH MIT GLOW */
        #clipper {
            margin: 20px auto; 
            overflow: hidden; 
            border: 3px solid var(--orange); 
            background: #000;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            box-shadow: 0 0 15px var(--orange-glow);
        }

        .clipper-setup { width: 310px; height: 220px; border-radius: 16px; overflow-x: auto !important; }
        
        /* DEINE MASSGABEN: 50px */
        .clipper-play { 
            width: 50px; height: 50px; 
            border-radius: 50%; 
            animation: pulseGlow 2s infinite; 
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 10px var(--orange); }
            50% { box-shadow: 0 0 25px var(--orange); }
        }

        #sc-frame {
            position: absolute;
            width: 600px; 
            height: 220px;
            border: none;
        }

        .frame-pos-setup { top: 0; left: 0; }
        /* DEINE MASSGABEN: top -7, left -5 */
        .frame-pos-play { top: -7px; left: -5px; } 

        /* BUTTONS */
        .action-btn { 
            background: linear-gradient(135deg, var(--orange) 0%, #ff2a00 100%);
            color: white; border: none; width: 100%; padding: 16px; border-radius: 16px; 
            font-weight: bold; cursor: pointer; margin-top: 15px; 
            box-shadow: 0 10px 20px rgba(255, 42, 0, 0.3);
            transition: all 0.2s; text-transform: uppercase;
        }

        .action-btn:active { transform: scale(0.95); }

        .party-btn {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.1);
            color: #666;
            font-size: 10px;
            padding: 8px;
            border-radius: 12px;
            margin-top: 20px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }
        .rave-active .party-btn { background: white; color: black; font-weight: bold; }

        .dev-skip { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #444; font-size: 10px; opacity: 0.5; }
    </style>
</head>
<body id="body">

<div class="card">
    <button class="dev-skip" onclick="manualId()">DEV_MODE</button>
    <div id="status">Bereit</div>
    
    <div id="player-area" style="display:none;">
        <div id="clipper" class="clipper-setup">
            <iframe id="sc-frame" class="frame-pos-setup" scrolling="yes" frameborder="no" allow="autoplay" 
                src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/1&show_artwork=false"></iframe>
        </div>
        <button id="mode-btn" class="action-btn" onclick="toggleMode()">Titel verstecken</button>
    </div>

    <div id="reader" style="width:100%; border-radius:20px; overflow:hidden; margin-top:15px; display:none; border: 1px solid #333;"></div>
    <button class="action-btn" id="scan-btn" onclick="toggleScanner()" style="margin-top:20px;">📷 Karte Scannen</button>
    
    <button class="party-btn" onclick="toggleRave()">✨ PARTY MODE EIN/AUS</button>
</div>

<script>
    let html5QrCode;
    let isLocked = false;
    let scWidget;

    window.onload = () => {
        scWidget = SC.Widget(document.getElementById('sc-frame'));
        const id = new URLSearchParams(window.location.search).get('id');
        if (id) loadSong(id);
    };

    function toggleRave() {
        document.getElementById('body').classList.toggle('rave-active');
    }

    async function loadSong(id) {
        try {
            const res = await fetch('songs.json');
            const songs = await res.json();
            if (songs[id]) {
                document.getElementById('status').innerText = "Karten-ID: #" + id;
                document.getElementById('player-area').style.display = "block";
                scWidget.load(songs[id], { visual: false, auto_play: false, show_artwork: false, color: "ff5500" });
            }
        } catch (e) { console.error(e); }
    }

    function toggleMode() {
        const clipper = document.getElementById('clipper');
        const frame = document.getElementById('sc-frame');
        const btn = document.getElementById('mode-btn');

        if (!isLocked) {
            clipper.className = "clipper-play";
            frame.className = "frame-pos-play";
            btn.innerText = "Titel anzeigen";
            isLocked = true;
        } else {
            clipper.className = "clipper-setup";
            frame.className = "frame-pos-setup";
            btn.innerText = "Titel verstecken";
            isLocked = false;
        }
    }

    function manualId() { const id = prompt("ID:"); if (id) loadSong(id); }

    function toggleScanner() {
        const readerEl = document.getElementById('reader');
        if (readerEl.style.display === 'block') {
            html5QrCode.stop().then(() => { readerEl.style.display = 'none'; });
        } else {
            readerEl.style.display = 'block';
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                const url = new URL(text);
                const id = url.searchParams.get("id");
                if (id) { html5QrCode.stop().then(() => { readerEl.style.display = 'none'; loadSong(id); }); }
            }, () => {});
        }
    }
</script>
</body>
</html>
