<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HITSTER DIY - PREMIUM MODE</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --green: #1DB954; --bg: #121212; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { background: #1e1e1e; border-radius: 24px; padding: 25px; width: 100%; max-width: 350px; text-align: center; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Login Bereich */
        #auth-area { display: block; }
        .auth-btn { background: var(--green); color: black; border: none; padding: 15px 20px; border-radius: 50px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 20px; }

        /* Spiel Bereich */
        #game-area { display: none; }
        
        /* Das Guckloch (unten rechts fokussiert) */
        #clipper {
            width: 75px; height: 75px; 
            margin: 20px auto; 
            overflow: hidden; 
            border-radius: 50%; 
            border: 4px solid var(--green); 
            position: relative; 
            background: #000;
        }
        #spotify-frame { 
            position: absolute;
            width: 525px;
            height: 352px;
            top: -257px;
            left: -424px;
            border: none;
        }

        .action-btn { background: var(--green); color: black; border: none; width: 100%; padding: 18px; border-radius: 50px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 15px; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-top: 15px; display: none; }
        .secondary-btn { background: transparent; color: #666; border: 1px solid #444; padding: 10px; border-radius: 50px; width: 100%; cursor: pointer; margin-top: 20px; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="card">

    <div id="game-area">
        <div id="status" style="color:var(--green); font-weight:bold; margin-bottom:10px;">BEREIT</div>
        
        <div id="clipper" style="display:none;">
            <iframe id="spotify-frame" src="" allow="autoplay; encrypted-media"></iframe>
        </div>

        <button id="load-btn" class="action-btn" style="display:none;" onclick="startPlayback()">▶ SONG STARTEN</button>
        
        <div id="reader"></div>
        <button class="action-btn" id="scan-trigger" onclick="toggleScanner()">📷 KARTE SCANNEN</button>
    </div>
</div>

<script>
    let html5QrCode;
    let currentTrackId = "";

    function showGame() {
        document.getElementById('auth-area').style.display = 'none';
        document.getElementById('game-area').style.display = 'block';
    }

    async function loadSong(id) {
        try {
            const res = await fetch('songs.json');
            const songs = await res.json();
            if (songs[id]) {
                currentTrackId = songs[id];
                document.getElementById('status').innerText = "KARTE #" + id + " GELADEN";
                document.getElementById('load-btn').style.display = 'block';
                document.getElementById('clipper').style.display = 'none';
                document.getElementById('spotify-frame').src = "";
            }
        } catch (e) { alert("Fehler bei songs.json"); }
    }

    function startPlayback() {
        const frame = document.getElementById('spotify-frame');
        frame.src = `https://open.spotify.com/embed/track/${currentTrackId}?utm_source=generator&theme=0`;
        
        document.getElementById('load-btn').style.display = 'none';
        document.getElementById('clipper').style.display = 'block';
        document.getElementById('status').innerText = "SPIELE...";
    }

    function toggleScanner() {
        const readerEl = document.getElementById('reader');
        if (readerEl.style.display === 'block') {
            if(html5QrCode) html5QrCode.stop().then(() => { readerEl.style.display = 'none'; });
        } else {
            readerEl.style.display = 'block';
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                const url = new URL(text);
                const id = url.searchParams.get("id");
                if (id) {
                    html5QrCode.stop().then(() => {
                        document.getElementById('reader').style.display = 'none';
                        loadSong(id);
                    });
                }
            }, () => {});
        }
    }
</script>
</body>

</html>
